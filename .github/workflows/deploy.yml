name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deployment at a time; do not cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Reports where GitHub Pages serves this repository:
      #   user site  https://<account>.github.io/        -> base_path ""
      #   project    https://<account>.github.io/<repo>/  -> base_path "/<repo>"
      #   custom domain (Settings -> Pages)               -> base_path ""
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Verify static output
        run: |
          test -f out/index.html
          test -f out/404.html
          test -f out/assets/bootstrap.min.css
          test -f out/assets/site.css
          test -f out/assets/site.js
          test -f out/publications/index.html
          test ! -d out/_next
          test -f out/.nojekyll
          test -f out/files/Adnan-Kavak-CV.pdf
          echo "Base path: '${{ steps.pages.outputs.base_path }}'  URL: ${{ steps.pages.outputs.base_url }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
